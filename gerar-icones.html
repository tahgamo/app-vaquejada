<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerar ícones</title></head>
<body style="font-family:system-ui;padding:24px;background:#f5efe4">
<div id="prev">Carregando ícone...</div>
<p><button id="b192">Baixar icon-192.png</button> <button id="b512">Baixar icon-512.png</button></p>
<script>
let svg='';
fetch('icons/icon.svg?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{svg=t;
  document.getElementById('prev').innerHTML='<img src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'" width="256" height="256" style="border-radius:48px">'})
 .catch(()=>document.getElementById('prev').textContent='Não achei icons/icon.svg');
function gen(size){if(!svg)return alert('Ícone ainda não carregou');const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;
  c.getContext('2d').drawImage(img,0,0,size,size);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`icon-${size}.png`;document.body.appendChild(a);a.click();a.remove()})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
document.getElementById('b192').onclick=()=>gen(192);
document.getElementById('b512').onclick=()=>gen(512);
</script>
</body></html>
