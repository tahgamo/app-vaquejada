<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a2a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Senhas de Vaquejada</title>
<style>
:root{
  --couro:#5b3519;--couro2:#3f230f;--caramelo:#c8862e;--caramelo2:#a86a1c;--ouro:#f6d58a;
  --areia:#f5efe4;--papel:#fffdf9;--ink:#2a1d14;--muted:#7a6a5c;--line:#e6dccd;
  --res:#2f6fd6;--res-bg:#e7efff;--paid:#d0402f;--paid-bg:#fde9e6;
  --radius:14px;--shadow:0 1px 2px rgba(60,35,15,.06),0 4px 14px rgba(60,35,15,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--areia);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;
  padding:calc(10px + env(safe-area-inset-top)) 8px 12px;
  background:linear-gradient(135deg,var(--couro),var(--couro2));color:#fff;
  box-shadow:0 2px 12px rgba(40,20,5,.25);border-bottom:2px dashed rgba(246,213,138,.28)}
.brand{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ttl{flex:1;min-width:0;text-align:center}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{display:block;font-size:12px;color:var(--ouro);opacity:.9;margin-top:1px}
.ib{background:none;border:0;color:#fff;font-size:26px;line-height:1;width:42px;height:42px;border-radius:50%;cursor:pointer;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
main{padding:16px 14px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 2px 10px}

/* Botões */
.btn{border:0;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;background:#efe7da;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--caramelo),var(--caramelo2));color:#fff;box-shadow:0 6px 16px rgba(168,106,28,.35)}
.btn.danger{background:var(--paid);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.outline{background:var(--papel);border:1px solid var(--line);color:var(--ink)}
.btn.outline.warn{color:var(--paid)}
.btn.share{width:100%;margin:2px 0 4px}

/* Cartões da tela inicial */
.card{display:block;width:100%;text-align:left;background:var(--papel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);border-left:5px solid var(--caramelo)}
.card:active{transform:scale(.99)}
.card .name{font-size:17px;font-weight:800}
.card .meta{color:var(--muted);font-size:13px;margin-top:3px}
.bar{display:flex;height:8px;border-radius:99px;background:#efe6d8;overflow:hidden;margin:12px 0 10px}
.bar i{display:block;height:100%}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.r{background:var(--res-bg);color:var(--res)}.pill.p{background:var(--paid-bg);color:var(--paid)}.pill.a{background:#f1ebe1;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);line-height:1.5}
.empty img{width:96px;height:96px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:14px}
.empty h3{color:var(--ink);margin:0 0 4px;font-size:18px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* Botão fixo inferior */
.fab{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(245,239,228,0),var(--areia) 40%);max-width:560px;margin:0 auto}
.fab .btn{width:100%;font-size:16px;padding:15px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--papel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--couro);color:#fff;border-color:var(--couro)}
.chip.add{border-style:dashed;border-color:var(--caramelo);color:var(--caramelo2);background:transparent}
.tabs .chip{font-variant-numeric:tabular-nums}
.tabs .chip.on{background:var(--caramelo);border-color:var(--caramelo)}
.daytitle{font-size:15px;font-weight:700;margin:2px 2px 10px}
.daytitle span{color:var(--muted);font-weight:500}

/* Resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 2px}
.stat{background:var(--papel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.stat.r b{color:var(--res)}.stat.p b{color:var(--paid)}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid #cbbfae;background:#fff;display:inline-block;flex:none}
.dot.r{background:var(--res);border-color:var(--res)}.dot.p{background:var(--paid);border-color:var(--paid)}

/* Grade de senhas */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.cell{aspect-ratio:1/.82;border:1px solid var(--line);border-radius:10px;background:var(--papel);color:var(--ink);
  font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:2px 3px;min-width:0;box-shadow:0 1px 2px rgba(60,35,15,.06);transition:transform .08s}
.cell small{font-size:10px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;opacity:.95}
.cell.r{background:var(--res);border-color:var(--res);color:#fff}
.cell.p{background:var(--paid);border-color:var(--paid);color:#fff}
.cell:active{transform:scale(.93)}

/* Gerenciar dia */
.manage{margin-top:18px;background:var(--papel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 4px}
.manage h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

/* Janelas */
.ov{position:fixed;inset:0;background:rgba(30,18,8,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.modal{background:var(--papel);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
.modal::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:#ddd2c2;margin:0 auto 14px}
.modal h2{margin:0 0 12px;font-size:20px;font-weight:800}
.modal p{color:var(--muted)}
.modal label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.modal input[type=text],.modal input[type=date]{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.modal input:focus{outline:2px solid var(--caramelo);border-color:transparent}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.opt i{display:block;width:28px;height:28px;border-radius:7px;border:1px solid #cbbfae;margin:0 auto 6px;background:#fff}
.opt.o-r i{background:var(--res);border-color:var(--res)}.opt.o-p i{background:var(--paid);border-color:var(--paid)}
.opt.on{border-color:var(--couro);background:#fbf5ea}
.acts{display:flex;gap:8px;margin-top:18px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='vaquejada-senhas-v1';
let db=load();
let view={eventId:null,dayId:null,range:0};
let installEvt=null;
const $app=document.getElementById('app');

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.events))return d}catch(e){}return{events:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não foi possível salvar')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDate(s){const[y,m,d]=s.split('-');return `${d}/${m}/${y}`}
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function wd(s){const[y,m,d]=s.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]}
function nextDate(s){const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+1))}
function base(day){return (day.n-1)*1000}
function counts(ev,day){let r=0,p=0;const lo=base(day)+1,hi=base(day)+day.ranges*100;
  for(const k in ev.tickets){const n=+k;if(n>=lo&&n<=hi){const s=ev.tickets[k].s;if(s==='r')r++;else if(s==='p')p++}}
  return{r,p,total:day.ranges*100}}
function evCounts(ev){let r=0,p=0;ev.days.forEach(d=>{const c=counts(ev,d);r+=c.r;p+=c.p});return{r,p}}
function curEv(){return db.events.find(e=>e.id===view.eventId)}
function curDay(ev){return ev.days.find(d=>d.id===view.dayId)||ev.days[0]}

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function closeModal(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function modal(html,focus){closeModal();const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});
  document.body.appendChild(o);
  if(focus){const i=o.querySelector('input[type=text]');if(i)setTimeout(()=>i.focus(),60)}
  return o}

/* ---------- Telas ---------- */
function render(){view.eventId?renderEvent():renderHome()}

function renderHome(){
  const list=db.events.length?`<h2 class="sec">Suas vaquejadas</h2>`+db.events.map(ev=>{
    const c=evCounts(ev);const total=ev.days.reduce((s,d)=>s+d.ranges*100,0);
    const dts=ev.days.map(d=>fmtDate(d.date).slice(0,5)).join(' · ');
    const pp=total?c.p/total*100:0,pr=total?c.r/total*100:0;
    return `<button class="card" data-act="open-ev" data-id="${ev.id}">
      <div class="name">${esc(ev.name)}</div>
      <div class="meta">${ev.days.length} ${ev.days.length>1?'dias':'dia'} · ${dts}</div>
      <div class="bar"><i style="width:${pp}%;background:var(--paid)"></i><i style="width:${pr}%;background:var(--res)"></i></div>
      <div class="pills"><span class="pill p">${c.p} pagas</span><span class="pill r">${c.r} reservadas</span><span class="pill a">${total-c.r-c.p} livres</span></div>
    </button>`}).join('')
    :`<div class="empty"><img src="icons/icon-192.png" alt=""><h3>Nenhuma vaquejada ainda</h3>Toque em <b>+ Nova vaquejada</b> para cadastrar a primeira.</div>`;
  $app.innerHTML=`<header class="top"><div class="brand"><img src="icons/icon-192.png" alt=""><h1>Senhas de Vaquejada</h1></div></header>
  <main>${list}
   <div class="foot">
    <button class="btn outline sm" data-act="export">Exportar backup</button>
    <button class="btn outline sm" data-act="import">Importar backup</button>
    ${installEvt?'<button class="btn outline sm" data-act="install">Instalar app</button>':''}
   </div></main>
  <div class="fab"><button class="btn primary" data-act="new-ev">+ Nova vaquejada</button></div>`;
}

function renderEvent(){
  const ev=curEv();if(!ev){view.eventId=null;return renderHome()}
  const day=curDay(ev);view.dayId=day.id;
  if(view.range>=day.ranges)view.range=day.ranges-1;
  const c=counts(ev,day);
  const lo=base(day)+view.range*100+1;
  const dayChips=ev.days.map(d=>`<button class="chip ${d.id===day.id?'on':''}" data-act="sel-day" data-id="${d.id}">Dia ${d.n} · ${fmtDate(d.date).slice(0,5)}</button>`).join('')
    +`<button class="chip add" data-act="add-day">+ Dia</button>`;
  let rangeTabs='';
  for(let i=0;i<day.ranges;i++){const a=base(day)+i*100+1;rangeTabs+=`<button class="chip ${i===view.range?'on':''}" data-act="sel-range" data-i="${i}">${a}–${a+99}</button>`}
  rangeTabs+=`<button class="chip add" data-act="add-range">+ Faixa</button>`;
  let cells='';
  for(let n=lo;n<lo+100;n++){const t=ev.tickets[n];const s=t&&t.s||'';
    cells+=`<button class="cell ${s}" data-act="cell" data-n="${n}">${n}${t&&t.name?`<small>${esc(t.name)}</small>`:''}</button>`}
  $app.innerHTML=`<header class="top"><button class="ib" data-act="back" aria-label="Voltar">‹</button>
    <div class="ttl"><h1>${esc(ev.name)}</h1><small>${ev.days.length} ${ev.days.length>1?'dias':'dia'} de prova</small></div>
    <button class="ib" data-act="ev-menu" aria-label="Opções">⋮</button></header>
  <main>
   <div class="chips">${dayChips}</div>
   <div class="daytitle">Dia ${day.n} <span>· ${wd(day.date)}, ${fmtDate(day.date)}</span></div>
   <div class="stats">
     <div class="stat"><b>${c.total-c.r-c.p}</b><span><i class="dot"></i>Disponíveis</span></div>
     <div class="stat r"><b>${c.r}</b><span><i class="dot r"></i>Reservadas</span></div>
     <div class="stat p"><b>${c.p}</b><span><i class="dot p"></i>Pagas</span></div>
   </div>
   <div class="chips tabs" style="margin-top:14px">${rangeTabs}</div>
   <button class="btn primary share" data-act="share">📤 Enviar senhas para escolha (${lo}–${lo+99})</button>
   <div class="grid">${cells}</div>
   <div class="manage"><h3>Gerenciar dia</h3>
    <div class="row">
     <button class="btn outline sm" data-act="day-date">Alterar data</button>
     <button class="btn outline sm" data-act="del-range">Remover última faixa</button>
     <button class="btn outline sm warn" data-act="del-day">Remover dia</button>
    </div></div>
  </main>`;
}

/* ---------- Ações ---------- */
function openEvent(id){view={eventId:id,dayId:null,range:0};history.pushState({ev:1},'');render();window.scrollTo(0,0)}
function goHome(){view={eventId:null,dayId:null,range:0};render();window.scrollTo(0,0)}
window.addEventListener('popstate',()=>{if(view.eventId){closeModal();goHome()}});

function newEvent(){
  const o=modal(`<h2>Nova vaquejada</h2>
   <label>Nome da vaquejada</label><input type="text" id="f-name" placeholder="Ex.: Vaquejada do Parque">
   <label>Data do 1º dia</label><input type="date" id="f-date" value="${ymd(new Date())}">
   <div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Criar</button></div>`,true);
  o.addEventListener('click',e=>{const m=e.target.dataset.m;if(m==='cancel')closeModal();
    if(m==='ok'){const name=o.querySelector('#f-name').value.trim(),date=o.querySelector('#f-date').value;
      if(!name)return toast('Informe o nome');if(!date)return toast('Escolha a data');
      const ev={id:uid(),name,days:[{id:uid(),n:1,date,ranges:1}],tickets:{}};
      db.events.unshift(ev);save();closeModal();openEvent(ev.id)}})
}

function evMenu(){
  const ev=curEv();
  const o=modal(`<h2>${esc(ev.name)}</h2>
   <div class="acts" style="flex-direction:column"><button class="btn" data-m="ren">Renomear vaquejada</button>
   <button class="btn danger" data-m="del">Excluir vaquejada</button><button class="btn" data-m="cancel">Fechar</button></div>`);
  o.addEventListener('click',e=>{const m=e.target.dataset.m;if(!m)return;
    if(m==='cancel')closeModal();
    if(m==='ren'){const n=prompt('Novo nome:',ev.name);
      if(n&&n.trim()&&n.trim()!==ev.name&&confirm(`Confirmar alteração do nome?\n\n${ev.name} → ${n.trim()}`)){ev.name=n.trim();save();closeModal();render()}}
    if(m==='del'){if(confirm(`Excluir "${ev.name}" e todas as senhas? Não dá para desfazer.`)){db.events=db.events.filter(x=>x!==ev);save();closeModal();history.back()}}})
}

function addDay(){
  const ev=curEv();const last=ev.days[ev.days.length-1];
  const o=modal(`<h2>Adicionar dia</h2><p style="margin:0">Será o dia ${Math.max(...ev.days.map(d=>d.n))+1} (senhas ${Math.max(...ev.days.map(d=>d.n))*1000+1} em diante).</p>
   <label>Data</label><input type="date" id="f-date" value="${nextDate(last.date)}">
   <div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Adicionar</button></div>`);
  o.addEventListener('click',e=>{const m=e.target.dataset.m;if(m==='cancel')closeModal();
    if(m==='ok'){const date=o.querySelector('#f-date').value;if(!date)return toast('Escolha a data');
      const d={id:uid(),n:Math.max(...ev.days.map(x=>x.n))+1,date,ranges:1};ev.days.push(d);save();closeModal();view.dayId=d.id;view.range=0;render()}})
}

function changeDate(){
  const ev=curEv(),day=curDay(ev);
  const o=modal(`<h2>Data do dia ${day.n}</h2><input type="date" id="f-date" value="${day.date}">
   <div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Salvar</button></div>`);
  o.addEventListener('click',e=>{const m=e.target.dataset.m;if(m==='cancel')closeModal();
    if(m==='ok'){const v=o.querySelector('#f-date').value;if(!v)return toast('Escolha a data');
      if(v===day.date){closeModal();return}
      if(!confirm(`Confirmar alteração da data do dia ${day.n}?\n\n${fmtDate(day.date)} → ${fmtDate(v)}`))return;
      day.date=v;save();closeModal();render()}})
}

function delDay(){
  const ev=curEv(),day=curDay(ev);
  if(ev.days.length<2)return toast('A vaquejada precisa ter ao menos 1 dia');
  if(!confirm(`Remover o dia ${day.n} e todas as senhas dele?`))return;
  const lo=base(day)+1,hi=base(day)+day.ranges*100;
  for(const k in ev.tickets){const n=+k;if(n>=lo&&n<=hi)delete ev.tickets[k]}
  ev.days=ev.days.filter(d=>d!==day);view.dayId=null;view.range=0;save();render()
}

function addRange(){const ev=curEv(),day=curDay(ev);day.ranges++;view.range=day.ranges-1;save();render()}
function delRange(){
  const ev=curEv(),day=curDay(ev);
  if(day.ranges<2)return toast('O dia precisa ter ao menos 1 faixa');
  const hi=base(day)+day.ranges*100,lo=hi-99;
  if(!confirm(`Remover a faixa ${lo}–${hi} e as senhas dela?`))return;
  for(const k in ev.tickets){const n=+k;if(n>=lo&&n<=hi)delete ev.tickets[k]}
  day.ranges--;if(view.range>=day.ranges)view.range=day.ranges-1;save();render()
}

function editTicket(n){
  const ev=curEv();const t=ev.tickets[n]||{s:'',name:''};let s=t.s||'';
  const btn=(v,l)=>`<button class="opt o-${v||'a'} ${s===v?'on':''}" data-s="${v}"><i></i>${l}</button>`;
  const o=modal(`<h2>Senha ${n}</h2>
   <label>Nome (opcional)</label><input type="text" id="f-name" value="${esc(t.name||'')}" placeholder="Nome de quem reservou" autocomplete="off">
   <label>Situação</label>
   <div class="opts">${btn('','Disponível')}${btn('r','Reservada')}${btn('p','Paga')}</div>
   <div class="acts"><button class="btn" data-m="cancel">Cancelar</button><button class="btn primary" data-m="ok">Salvar</button></div>`);
  o.addEventListener('click',e=>{
    const ob=e.target.closest('.opt');
    if(ob){s=ob.dataset.s;o.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===ob));return}
    const m=e.target.dataset.m;if(m==='cancel')closeModal();
    if(m==='ok'){const name=o.querySelector('#f-name').value.trim();
      const existed=!!ev.tickets[n];const oldS=t.s||'',oldName=t.name||'';
      if(existed){
        if(s===oldS&&name===oldName){closeModal();return}
        const L={'':'Disponível',r:'Reservada',p:'Paga'};const ch=[];
        if(s!==oldS)ch.push(`Situação: ${L[oldS]} → ${L[s]}`);
        if(name!==oldName)ch.push(`Nome: ${oldName||'(vazio)'} → ${name||'(vazio)'}`);
        if(!confirm(`Confirmar alteração da senha ${n}?\n\n${ch.join('\n')}`))return}
      if(!s&&!name)delete ev.tickets[n];else ev.tickets[n]={s,name};
      save();closeModal();render()}})
}

function exportData(){
  const b=new Blob([JSON.stringify(db)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`senhas-vaquejada-${ymd(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.events))throw 0;
      if(!confirm('Isso substitui todos os dados atuais pelos do backup. Continuar?'))return;
      db=d;save();goHome();toast('Backup importado')}catch(e){toast('Arquivo inválido')}};r.readAsText(f)};
  i.click()
}

/* ---------- Imagem da faixa para compartilhar ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fitText(g,t,max){t=String(t);if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}

function rangeCanvas(ev,day,lo){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  // Na imagem compartilhada, reservadas e pagas viram "indisponíveis" (sem expor a situação interna)
  let ind=0;
  for(let n=lo;n<lo+100;n++){const s=ev.tickets[n]&&ev.tickets[n].s;if(s==='r'||s==='p')ind++}
  const livres=100-ind;

  // Fundo e cabeçalho
  g.fillStyle='#f5efe4';g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,190);gr.addColorStop(0,'#5b3519');gr.addColorStop(1,'#3f230f');
  g.fillStyle=gr;g.fillRect(0,0,W,190);
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';g.font=`800 50px ${F}`;g.fillText(fitText(g,ev.name,W-80),W/2,72);
  g.fillStyle='#f6d58a';g.font=`600 32px ${F}`;
  g.fillText(fitText(g,`Dia ${day.n} · ${wd(day.date)}, ${fmtDate(day.date)} · Senhas ${lo}–${lo+99}`,W-80),W/2,135);

  // Legenda (apenas 2 itens)
  const items=[[`Disponíveis: ${livres}`,'#fffdf9','#cbbfae'],[`Indisponíveis: ${ind}`,'#dcd6cd','#c9c1b5']];
  g.font=`700 30px ${F}`;g.textAlign='left';
  const sq=34,g1=12,g2=56;
  let x=(W-(items.reduce((s,i)=>s+sq+g1+g.measureText(i[0]).width,0)+g2*(items.length-1)))/2;
  const ly=245;
  items.forEach(([t,f,b])=>{rr(g,x,ly-sq/2,sq,sq,8);g.fillStyle=f;g.fill();g.strokeStyle=b;g.lineWidth=2;g.stroke();
    x+=sq+g1;g.fillStyle='#2a1d14';g.fillText(t,x,ly+1);x+=g.measureText(t).width+g2});

  // Grade 10x10
  const L=40,T=300,G=10,cw=(W-2*L-9*G)/10,ch=84;
  g.textAlign='center';
  for(let i=0;i<100;i++){
    const n=lo+i,s=ev.tickets[n]&&ev.tickets[n].s,off=s==='r'||s==='p',
      cx=L+(i%10)*(cw+G),cy=T+Math.floor(i/10)*(ch+G);
    rr(g,cx,cy,cw,ch,14);
    if(off){
      // "Apagada": fundo cinza claro e número esmaecido
      g.fillStyle='#dcd6cd';g.fill();
      g.fillStyle='#b3aba0';
    }else{
      g.fillStyle='#fffdf9';g.fill();
      g.strokeStyle='#d9ccb8';g.lineWidth=2;g.stroke();
      g.fillStyle='#2a1d14';
    }
    g.font=`800 ${n>=1000?30:36}px ${F}`;
    g.fillText(String(n),cx+cw/2,cy+ch/2+1);
  }

  // Rodapé
  g.fillStyle='#7a6a5c';g.font=`600 28px ${F}`;
  g.fillText(livres?'Escolha uma senha em branco e me envie o número':'Todas as senhas desta faixa já foram escolhidas',W/2,1282);
  const now=new Date();g.font=`500 22px ${F}`;
  g.fillText(`Atualizado em ${fmtDate(ymd(now))} às ${pad(now.getHours())}:${pad(now.getMinutes())}`,W/2,1322);
  return c;
}

// Conversão síncrona para não perder o "toque" do usuário (exigência do iPhone para compartilhar)
function canvasToFile(c,name){
  const d=atob(c.toDataURL('image/png').split(',')[1]);const u=new Uint8Array(d.length);
  for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);
  return new File([u],name,{type:'image/png'})}

async function shareRange(){
  const ev=curEv(),day=curDay(ev),lo=base(day)+view.range*100+1;
  const slug=ev.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'vaquejada';
  const file=canvasToFile(rangeCanvas(ev,day,lo),`senhas-${slug}-dia${day.n}-${lo}-${lo+99}.png`);
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}
    catch(e){if(e.name==='AbortError')return}
  }
  // Reserva: baixa a imagem
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Imagem salva. Agora é só enviar pelo WhatsApp');
}

$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
    case'open-ev':openEvent(el.dataset.id);break;
    case'back':history.state&&history.state.ev?history.back():goHome();break;
    case'new-ev':newEvent();break;
    case'ev-menu':evMenu();break;
    case'sel-day':view.dayId=el.dataset.id;view.range=0;render();break;
    case'add-day':addDay();break;
    case'day-date':changeDate();break;
    case'del-day':delDay();break;
    case'sel-range':view.range=+el.dataset.i;render();break;
    case'add-range':addRange();break;
    case'del-range':delRange();break;
    case'share':shareRange();break;
    case'cell':editTicket(+el.dataset.n);break;
    case'export':exportData();break;
    case'import':importData();break;
    case'install':if(installEvt){installEvt.prompt();installEvt=null;render()}break;
  }
});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!view.eventId)renderHome()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
</script>
